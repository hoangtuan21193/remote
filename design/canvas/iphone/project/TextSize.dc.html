<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aa — text size ruler</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#9BB7FF}a:hover{color:#C3D3FF}
</style>
</helmet>
<div style="width: 874px; height: 402px; position: relative; overflow: hidden; background: #000000; color: #EEF0F3; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif">

  <div style="position: absolute; left: 0; top: 0; width: 874px; height: 78px; background: #16181C"></div>
  <div style="position: absolute; left: 76px; top: 10px; width: 64px; height: 58px; border-radius: 14px; background: #23262C; opacity: 0.35" aria-hidden="true"></div>
  <div style="position: absolute; left: 152px; top: 10px; height: 58px; display: flex; gap: 12px; opacity: 0.35" aria-hidden="true">
    <span style="width: 92px; border-radius: 9px; background: #26282D"></span><span style="width: 92px; border-radius: 9px; background: #26282D"></span><span style="width: 92px; border-radius: 9px; background: #26282D"></span>
  </div>
  <div style="position: absolute; left: 734px; top: 10px; width: 64px; height: 58px; border-radius: 14px; background: #23262C; opacity: 0.35" aria-hidden="true"></div>

  <div role="slider" aria-label="Text size" aria-valuemin="0.5" aria-valuemax="1.5" aria-valuenow="1.25" aria-valuetext="1.25 times" style="position: absolute; left: 398px; top: 10px; width: 320px; height: 58px; box-sizing: border-box; border-radius: 14px; background: #2C3550; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; text-align: center">
    <span style="color: #A4ABB5; opacity: 0.35; font-size: 13px">0.5×</span>
    <span style="color: #A4ABB5; opacity: 0.6; font-size: 14px">0.75×</span>
    <span style="color: #A4ABB5; opacity: 0.85; font-size: 15px">1×</span>
    <span style="display: flex; flex-direction: column; align-items: center; gap: 2px; color: #9BB7FF"><span style="font-size: 19px; font-weight: 600">Aa</span><span style="font-size: 11px; font-weight: 600">1.25×</span></span>
    <span style="color: #A4ABB5; opacity: 0.85; font-size: 15px">1.5×</span>
  </div>

  <div style="position: absolute; left: 70px; top: 86px; width: 734px; height: 287px; border-radius: 12px; background: #1F2126; display: flex; justify-content: center; overflow: hidden" aria-hidden="true">
    <div style="width: 459px; height: 287px; background: #FFFFFF; display: flex; flex-direction: column">
      <div style="height: 24px; background: #ECECEC"></div>
      <div style="padding: 14px; font-size: 13px; line-height: 20px; color: #222"><b style="font-size: 16px">Groceries</b><br>Eggs<br>Coffee beans<br>Lemons</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":874,"height":402}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
