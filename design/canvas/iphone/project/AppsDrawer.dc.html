    <button style="height: 50px; border: 0; border-radius: 10px; background: transparent; color: #EEF0F3; display: flex; align-items: center; gap: 12px; padding: 0 10px; font: 15px -apple-system, system-ui, sans-serif; text-align: left"><span style="width: 32px; height: 32px; border-radius: 9px; background: #3A3D44; color: #FFF; font: 700 12px/32px -apple-system, system-ui, sans-serif; text-align: center">Te</span><span style="flex: 1">Terminal</span><span style="font-size: 13px; color: #A4ABB5">1 window</span></button>
